<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>测评 · 星辰测评</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 7l2.7 6.2 6.7.6-5.1 4.4 1.5 6.5L16 21.2l-5.8 3.5 1.5-6.5-5.1-4.4 6.7-.6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=20260901c">
<script src="js/theme.js?v=20260901a"></script>
</head>
<body class="intro-page">
<div class="app">

  <!-- ================= Hero 区 ================= -->
  <header class="lp-hero" id="lpHero">
    <div class="lp-hero__bg" id="heroBg"></div>

    <div class="lp-hero__inner">
      <div class="lp-hero__text">
        <div class="lp-hero__tags" id="heroTags"></div>
        <h1 class="lp-hero__title" id="heroTitle"></h1>
        <p class="lp-hero__hook" id="heroHook"></p>
        <div class="lp-hero__stats" id="heroStats"></div>
        <button class="lp-hero__cta" id="startBtn" type="button">开始测试</button>
      </div>
      <div class="lp-hero__visual" id="heroVisual"></div>
    </div>
  </header>

  <!-- ================= 信任条（只保留题源与隐私两条） ================= -->
  <div class="lp-trust">
    <div class="lp-trust__item">
      <svg class="lp-trust__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 4.6 6.4 11.4 2.8 7.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      官方公开题源
    </div>
    <div class="lp-trust__item">
      <svg class="lp-trust__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 4.6 6.4 11.4 2.8 7.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      匿名作答，不留存你的数据
    </div>
  </div>

  <!-- ================= 版本选择（双版本量表） ================= -->
  <section id="versionSection" class="lp-section hidden">
    <h2 class="lp-section__title">选择测评深度<span class="lp-section__sub" id="versionSub"></span></h2>
    <div id="versionBlock" class="lp-versions"></div>
  </section>

  <!-- ================= 开始测试（版本选择下方） ================= -->
  <div class="lp-start-cta">
    <button class="btn-ghost lp-start-cta__btn" id="startBtn3" type="button">开始测试</button>
    <p class="lp-start-cta__hint">免费 · 匿名 · 即开即测</p>
  </div>

  <!-- ================= 测什么 ================= -->
  <section class="lp-section">
    <h2 class="lp-section__title">测什么<span class="lp-section__sub" id="whatSub"></span></h2>
    <p class="lp-what__lead" id="whatIntro"></p>
    <div id="whatBlock" class="lp-what"></div>
  </section>

  <!-- ================= 测完得到什么 ================= -->
  <section class="lp-section">
    <h2 class="lp-section__title">测完你会得到<span class="lp-section__sub">一份能看懂、能分享的结果</span></h2>
    <div id="gainBlock" class="lp-gain"></div>
  </section>

  <!-- ================= 使用指南（TAB：使用场景 / 如何使用 / 常见问题） ================= -->
  <section class="lp-section">
    <h2 class="lp-section__title">使用指南<span class="lp-section__sub">场景 · 步骤 · 常见问题</span></h2>
    <div class="lp-tabs">
      <div class="lp-tabs__nav" role="tablist">
        <button class="lp-tabs__tab active" type="button" role="tab" data-tab="scenario">使用场景</button>
        <button class="lp-tabs__tab" type="button" role="tab" data-tab="steps">如何使用</button>
        <button class="lp-tabs__tab" type="button" role="tab" data-tab="faq">常见问题</button>
      </div>
      <div class="lp-tabs__body">
        <div class="lp-tabs__pane active" id="tab-scenario" role="tabpanel"></div>
        <div class="lp-tabs__pane" id="tab-steps" role="tabpanel">
          <div class="lp-steps" id="stepsBlock"></div>
          <div class="lp-instruction card" id="tab-instruction"></div>
        </div>
        <div class="lp-tabs__pane" id="tab-faq" role="tabpanel"></div>
      </div>
    </div>
  </section>

  <!-- ================= 免责声明 ================= -->
  <section id="introDisclaimer" class="lp-disclaimer"></section>

  <!-- ================= 底部 CTA ================= -->
  <section class="lp-bottom-cta" id="bottomCta">
    <p class="lp-bottom-cta__title" id="ctaTitle"></p>
    <button class="btn-primary lp-bottom-cta__btn" id="startBtn2" type="button">开始测试</button>
  </section>

  <!-- ================= 相关推荐 ================= -->
  <section class="lp-section">
    <h2 class="lp-section__title">你可能还想测<span class="lp-section__sub">探索更多自己</span></h2>
    <div id="recBlock" class="lp-rec"></div>
  </section>

  <footer class="footer">
    <p>星辰测评 · 免费匿名测评 · 仅供自我探索与参考</p>
  </footer>

</div>

<script src="data/animal.js"></script>

<script src="data/lovebrain.js"></script>
<script src="js/intro.js?v=20260901a"></script>
</body>
</html>
