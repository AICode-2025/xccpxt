<div class="app">

  <!-- Hero（参考 traits.zqbapp.cn） -->

  <!-- 锚点导航 -->

    <!-- 自我探索 -->

      <h2 class="section__title">热门测评</h2>
      <p class="section__sub">认识自己，从 5 分钟开始</p>
      <div class="group">
        <h3 class="group__title">自我探索</h3>
        <div id="list-explore" class="grid"></div>
      </div>
    </section>

    <!-- 心理筛查 -->
    <section id="screen" class="section">
      <div class="group">
        <h3 class="group__title">心理筛查</h3>
        <p class="group__note">自评参考工具，结果不构成医学诊断，不提供诊断与治疗功能</p>
        <div id="list-screen" class="grid"></div>
      </div>
    </section>


  </main>

  <footer class="footer">
    <p>本站所有测试免费且匿名，答题数据仅保存在你的设备本地，不会上传。</p>
    <p>测评结果仅供自我探索与参考，不构成任何医学诊断。</p>
  </footer>
